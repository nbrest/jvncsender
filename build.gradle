import org.gradle.api.tasks.bundling.Jar

plugins {
  id 'java-library'
}

group = 'be.jedi'
version = '1.08-SNAPSHOT'

/*
 * Central place for every version/property that was defined in the Maven pom.xml.
 */
ext.jvncsenderVersions = [
  'java.target.version'           : '25',
  'project.build.sourceEncoding'  : 'UTF-8',

  // Dependency versions
  'commons.cli.version'           : '1.4',
  'junit.jupiter.version'         : '5.8.0-M1',
  'junit.platform.version'        : '1.8.0-M1',
  'logback.version'               : '1.4.14',
  'tightvnc.vncviewer.version'    : '1.3.10'
]

def versions = ext.jvncsenderVersions

ext.commonsLoggingExclusion = [group: 'commons-logging', module: 'commons-logging']

dependencies {
  api "com.tightvnc:vncviewer:${versions['tightvnc.vncviewer.version']}"
  api "commons-cli:commons-cli:${versions['commons.cli.version']}"
  api("ch.qos.logback:logback-classic:${versions['logback.version']}") {
    exclude rootProject.ext.commonsLoggingExclusion
  }

  testImplementation "org.junit.jupiter:junit-jupiter-api:${versions['junit.jupiter.version']}"
  testImplementation "org.junit.jupiter:junit-jupiter-params:${versions['junit.jupiter.version']}"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${versions['junit.jupiter.version']}"
  // Gradle 9 doesn't provide the junit platform launcher on the test runtime classpath anymore
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:${versions['junit.platform.version']}"
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = versions['java.target.version'].toInteger()
  options.encoding = versions['project.build.sourceEncoding']
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
}

/** Replaces the maven-assembly-plugin jar-with-dependencies. */
tasks.register('jarWithDependencies', Jar) {
  group = 'build'
  description = 'Builds an executable jar with all its dependencies.'
  archiveClassifier = 'jar-with-dependencies'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  manifest {
    attributes 'Main-Class': 'com.nicobrest.kamehouse.jvncsender.VncServerMain'
  }
  from(sourceSets.main.output)
  from({
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  })
}

tasks.named('build') {
  dependsOn tasks.named('jarWithDependencies')
}
